<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺北跑者空品地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/web/aq_data.js"></script>
<script src="data/web/grid.js"></script>
<script src="data/web/trees.js"></script>
<script src="data/web/parks.js"></script>
<script src="data/web/roads.js"></script>
<script src="data/web/osm_coverage.js"></script>
<style>
  :root {
    --coral:#ff6b4a; --coral-d:#e8502f; --coral-s:#fff0eb; --green:#22a861; --green-s:#e7f7ee; --sky:#2f9bf0; --sky-s:#e8f4fe;
    --ink:#1f2933; --muted:#6b7280; --line:#e7e9ee; --bg:#f6f7f9; --card:#ffffff; --shadow:0 6px 24px rgba(31,41,51,.10), 0 1px 3px rgba(31,41,51,.06);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.55 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; }
  .num { font-family:"Barlow","Noto Sans TC",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.2px; }
  #map { position:absolute; inset:0; }
  #panel { position:absolute; top:14px; left:14px; width:384px; max-height:calc(100% - 28px); display:flex; flex-direction:column; background:var(--card); border-radius:18px; box-shadow:var(--shadow); z-index:2; overflow:hidden; }
  #head { padding:14px 16px 10px; background:linear-gradient(135deg,#ffe2d6 0%,#fff4e6 55%,#e9f6ff 100%); position:relative; }
  #head h1 { font-size:18px; margin:0; display:flex; align-items:center; gap:8px; }
  #head h1 .sun { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 50% 60%,#ffb199,#ff6b4a); box-shadow:0 0 0 4px rgba(255,107,74,.15); flex:none; }
  #head .q { color:#5b4a43; font-size:12.5px; margin:4px 0 0; }
  #fold { position:absolute; top:12px; right:12px; border:0; background:rgba(255,255,255,.85); color:var(--ink); border-radius:999px; padding:6px 12px; font:600 12.5px "Noto Sans TC"; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  #handle { display:none; }
  #body { overflow:auto; padding:10px 14px 14px; }
  .tabs { display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:12px; margin:4px 0 10px; }
  .tabs button { flex:1; border:0; background:transparent; padding:8px 4px; border-radius:9px; font:600 13.5px "Noto Sans TC"; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:#fff; color:var(--coral-d); box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin:10px 0; }
  .card h3 { font-size:14px; margin:0 0 8px; display:flex; align-items:center; gap:6px; }
  .row { margin:8px 0; }
  .lab { font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:500; }
  .seg { display:flex; flex-wrap:wrap; gap:5px; }
  .seg button, .btn { flex:1 1 auto; background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:7px 9px; font:500 13px "Noto Sans TC"; cursor:pointer; min-height:36px; transition:all .12s; }
  .seg button:hover, .btn:hover { border-color:#ffb8a6; }
  .seg button.on { background:var(--coral); color:#fff; border-color:var(--coral); font-weight:700; box-shadow:0 2px 8px rgba(255,107,74,.35); }
  .btn.primary { background:var(--coral); color:#fff; border-color:var(--coral); font-weight:700; }
  .btn.ghost { background:var(--bg); }
  .btn.on { background:var(--coral-s); border-color:var(--coral); color:var(--coral-d); font-weight:700; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  select, input[type=number] { background:#fff; color:var(--ink); border:1.5px solid var(--line); border-radius:10px; padding:6px 8px; font:500 13px "Noto Sans TC"; }
  select { width:100%; }
  input[type=range] { accent-color:var(--coral); }
  .switch { display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; margin-right:12px; }
  .switch input { width:18px; height:18px; accent-color:var(--coral); }
  .legend .item { display:flex; align-items:center; gap:7px; font-size:12px; margin:2px 0; }
  .sw { width:24px; height:13px; border-radius:4px; display:inline-block; border:1px solid rgba(0,0,0,.08); flex:none; }
  .note { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .warn { font-size:12px; color:#9a4a00; background:#fff6e5; border-radius:10px; padding:7px 9px; margin-top:8px; }
  .big { font-size:30px; line-height:1; }
  .stat { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .stat > div { display:flex; flex-direction:column; }
  .stat small { font-size:11.5px; color:var(--muted); }
  .tag { display:inline-block; font-size:11px; padding:2px 7px; border-radius:999px; background:var(--bg); color:var(--muted); margin-left:6px; font-weight:500; }
  .tag.est { background:#fff1e0; color:#a35200; }
  .tag.ok { background:var(--green-s); color:#167a45; }
  .best { color:var(--green); font-weight:700; } .worst { color:#e5484d; font-weight:700; }
  svg text { fill:var(--muted); font-size:10.5px; font-family:"Barlow","Noto Sans TC",sans-serif; }
  table.t { border-collapse:collapse; font-size:12.5px; width:100%; margin-top:6px; }
  table.t td, table.t th { border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; }
  table.t th:first-child { text-align:left; font-weight:500; color:var(--muted); }
  table.t td.num { font-size:14px; }
  .pref { display:grid; grid-template-columns:24px 1fr 92px 36px; align-items:center; gap:6px; margin:6px 0; font-size:13px; }
  .pref .ico { font-size:16px; text-align:center; }
  .pref .lv { font-size:12px; color:var(--coral-d); font-weight:700; text-align:right; }
  .summary { background:linear-gradient(135deg,#fff0eb,#effaf4); border-radius:12px; padding:10px 12px; font-size:13.5px; margin-top:8px; }
  .maplibregl-popup-content { background:#fff; color:var(--ink); font-size:12.5px; border-radius:12px; box-shadow:var(--shadow); padding:10px 12px; }
  .maplibregl-popup-close-button { font-size:16px; padding:2px 6px; }
  #err { display:none; position:absolute; top:14px; right:60px; background:#fff1f0; color:#a8071a; padding:8px 12px; border-radius:10px; z-index:3; box-shadow:var(--shadow); }
  #loading { display:none; }
  [hidden] { display:none !important; }
  /* 手機：底部抽屜，可收合 */
  @media (max-width:700px) {
    #panel { top:auto; bottom:0; left:0; right:0; width:auto; max-height:58%; border-radius:18px 18px 0 0; }
    #panel.folded #body { display:none; }
    #handle { display:block; width:42px; height:5px; border-radius:3px; background:rgba(0,0,0,.18); margin:0 auto 8px; }
    #head { padding:8px 14px 10px; }
    #head .q { display:none; }
    .maplibregl-ctrl-top-right { top:4px; }
  }
  @media (min-width:701px) { #panel.folded #body { display:none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<div id="panel">
  <div id="head">
    <div id="handle"></div>
    <h1><span class="sun"></span>臺北跑者空品地圖</h1>
    <p class="q">上下班車潮時段，臺北哪裡的空氣比較差？什麼時候、走哪條路跑步比較好？</p>
    <button id="fold">收合</button>
  </div>
  <div id="body">
    <div class="tabs" id="tabs"><button data-t="aq" class="on">空品地圖</button><button data-t="draw">畫路線</button><button data-t="plan">規劃路線</button></div>

    <!-- 共用情境 -->
    <div class="card" id="scenario">
      <div class="row"><div class="lab">時段</div><div class="seg" id="slot"></div></div>
      <div class="row"><div class="lab">日子</div><div class="seg" id="daytype"></div></div>
      <div class="row"><div class="lab">季節</div><div class="seg" id="season"></div></div>
      <div class="row"><div class="lab">指標</div><div class="seg" id="pol"></div></div>
    </div>

    <!-- 分頁：空品地圖 -->
    <section data-p="aq">
      <div class="card">
        <div class="row"><div class="lab">行政區</div><select id="dist"></select></div>
        <div class="row"><div class="lab">面量顯示</div><div class="seg" id="view"></div></div>
        <div class="row"><label class="switch"><input type="checkbox" id="showTraffic" checked>交通站（路邊）</label><label class="switch"><input type="checkbox" id="showParks" checked>公園</label><label class="switch"><input type="checkbox" id="showRoads">幹道</label></div>
      </div>
      <div class="card"><div class="legend" id="legend"></div><div class="note" id="estnote"></div><div class="warn" id="aqinote" hidden></div></div>
      <div class="card" id="info"></div>
      <div class="card" id="rscard"></div>
    </section>

    <!-- 分頁：畫路線 -->
    <section data-p="draw" hidden>
      <div class="card">
        <h3>✏️ 畫自己的路線</h3>
        <div class="btns"><button class="btn primary" id="drawStart">開始畫線</button><button class="btn" id="drawUndo">復原上一點</button><button class="btn" id="drawClear">清除</button><button class="btn" id="drawEnd">結束</button></div>
        <div class="note" id="drawHint">按「開始畫線」後在地圖上逐點點擊，雙擊（或按「結束」）完成。</div>
        <div class="row" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">配速 <input id="pace" type="number" value="6" min="2" max="15" step="0.1" style="width:64px"> 分鐘／公里
          <span style="flex:1"></span><button class="btn ghost" id="drawExport" style="flex:none">匯出 GeoJSON</button><label class="btn ghost" style="flex:none;text-align:center">匯入<input id="drawImport" type="file" accept=".geojson,.json,application/geo+json" hidden></label></div>
      </div>
      <div id="drawOut"></div>
    </section>

    <!-- 分頁：規劃路線 -->
    <section data-p="plan" hidden>
      <div class="card">
        <h3>🧭 自動規劃 A → B</h3>
        <div class="btns"><button class="btn" id="pickStart">① 點地圖設起點</button><button class="btn" id="pickEnd">② 點地圖設終點</button><button class="btn ghost" id="clearRoute">清除</button></div>
        <div class="note" id="pickHint">先按①再點地圖，接著按②再點地圖。時段等情境用上方設定。</div>
        <div class="warn" id="netStatus" hidden></div>
      </div>
      <div class="card">
        <h3>偏好</h3>
        <div class="lab">避開</div><div id="prefAvoid"></div>
        <div class="lab" style="margin-top:8px">偏好</div><div id="prefLike"></div>
        <div class="row" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px">建議路線最多比最短路線長 <input id="maxRatio" type="number" value="1.3" min="1" max="3" step="0.05" style="width:64px"> 倍</div>
        <div class="note" id="covNote"></div>
      </div>
      <div id="routeOut"></div>
    </section>

    <!-- 共用：路邊加成設定 -->
    <div class="card" id="rsSettings">
      <h3>路邊加成設定 <span class="tag">畫線、規劃共用</span></h3>
      <div class="row"><div class="lab">「主要幹道」包含</div><div class="seg" id="major"></div></div>
      <div class="row" style="font-size:12.5px">幹道 <input id="rsFull" type="number" value="50" min="0" max="500" style="width:62px"> m 內全額，到 <input id="rsZero" type="number" value="150" min="1" max="1000" style="width:62px"> m 線性遞減為 0 <span class="tag est">假設值</span></div>
    </div>

    <div class="note" id="src"></div>
  </div>
</div>

<script>
// ================= 常數與狀態 =================
// AQI：環境部官方分級色（良好 #00e800、普通 #ffff00、對敏感族群不健康 #ff7e00、對所有族群不健康 #ff0000、非常不健康 #8f3f97、危害 #7e0023）；
// 同一級內用同色系深淺區分，方便看出平均值的差異。
const AQI_BINS = [30, 40, 50, 60, 75, 100, 150, 200, 300];
const AQI_COLORS = ['#c9f7c9', '#7cf07c', '#00e800', '#ffffa6', '#ffff00', '#f0e000', '#ff7e00', '#ff0000', '#8f3f97', '#7e0023'];
const AQI_LEVELS = ['良好', '良好', '良好', '普通', '普通', '普通', '對敏感族群不健康', '對所有族群不健康', '非常不健康', '危害'];
// 污染物：非官方的連續色階，只表示相對高低
const POL_COLORS = ['#fff5d6', '#fde29a', '#fdb863', '#f4845f', '#d1495b', '#8e2c56'];
const POLS = { 'AQI':{ label:'AQI', unit:'', bins:AQI_BINS, colors:AQI_COLORS },
               'NO2':{ label:'NO₂', unit:'ppb', bins:[6, 9, 12, 16, 22], colors:POL_COLORS },
               'PM2.5':{ label:'PM2.5', unit:'μg/m³', bins:[8, 10, 12, 14, 16], colors:POL_COLORS },
               'O3':{ label:'O₃', unit:'ppb', bins:[15, 22, 29, 36, 45], colors:POL_COLORS } };
const MISSING = '#c4c8cf';
const SEASONS = { all:'全年', winter:'冬', spring:'春', summer:'夏', autumn:'秋' };
const SEASON_FULL = { all:'全年', winter:'冬 12–2月', spring:'春 3–5月', summer:'夏 6–8月', autumn:'秋 9–11月' };
const DAYS = { weekday:'平日', holiday:'假日' };
const SLOTS = { dawn:'清晨 5–7', am_peak:'上班 7–9', noon:'中午 11–13', pm_peak:'下班 17–19', night:'夜間 19–22' };
const SLOT_FULL = { dawn:'清晨 5–7', am_peak:'上班尖峰 7–9', noon:'中午 11–13', pm_peak:'下班尖峰 17–19', night:'夜間 19–22' };
const SLOT_SHORT = { dawn:'清晨', am_peak:'上班', noon:'中午', pm_peak:'下班', night:'夜間' };
const PEAK = ['am_peak', 'pm_peak'], OFF = ['dawn', 'noon', 'night'];
const VIEWS = { district:'行政區', grid:'500 m 網格' };
const FAR_M = 4000;
const S = { pol:'AQI', season:'all', daytype:'weekday', slot:'am_peak', dist:-1, view:'district', tab:'aq' };
const ST = window.AQ_STATIONS, G = window.GRID, D = window.DISTRICTS, RS = window.AQ_ROADSIDE;
const NAMES = D.features.map(f => f.properties.name);
const USE = ST.map(s => s.type === '一般站');   // IDW 只用 9 個一般站；交通站只顯示、不內插
const C = { coral:'#ff6b4a', green:'#22a861', sky:'#2f9bf0', grey:'#7b8494' };

// ================= 空品計算 =================
const stationVals = (pol, se, dt, sl) => window.AQ_VALUES[pol][se][dt][sl];
function idw(dist, vals) {
  let num = 0, den = 0;
  for (let i = 0; i < vals.length; i++) { const v = vals[i]; if (v === null || !USE[i]) continue; const d = dist[i]; if (d < 1) return v; const w = 1 / (d * d); num += w * v; den += w; }
  return den ? num / den : null;
}
const gridVals = (pol, se, dt, sl) => { const sv = stationVals(pol, se, dt, sl).v; return G.map(c => idw(c.dist, sv)); };
function districtVals(gv) {
  const sum = Array(NAMES.length).fill(0), n = Array(NAMES.length).fill(0);
  G.forEach((c, i) => { if (gv[i] !== null) { sum[c.d] += gv[i]; n[c.d]++; } });
  return sum.map((s, i) => n[i] ? s / n[i] : null);
}
function colorOf(v, pol) { if (v === null || v === undefined) return MISSING; const P = POLS[pol]; let k = 0; while (k < P.bins.length && v >= P.bins[k]) k++; return P.colors[k]; }
const fmt = (v, pol) => v === null || v === undefined ? '缺值' : v.toFixed(1);
const unit = p => POLS[p].unit ? ' ' + POLS[p].unit : '';
const aqiLevel = v => { let k = 0; while (k < AQI_BINS.length && v >= AQI_BINS[k]) k++; return AQI_LEVELS[k]; };

// ================= 網格幾何 =================
const dLat = (window.GRID_CELL_M / 2) / 110950;
const gridFC = { type:'FeatureCollection', features: G.map((c, i) => {
  const dLon = (window.GRID_CELL_M / 2) / (111320 * Math.cos(c.lat * Math.PI / 180));
  const gd = c.dist.map((d, k) => USE[k] ? d : Infinity), near = Math.min(...gd), ni = gd.indexOf(near);
  return { type:'Feature', id:i, properties:{ i, d:c.d, near_m:near, near_st:ST[ni].name, far: near > FAR_M },
    geometry:{ type:'Polygon', coordinates:[[[c.lon-dLon,c.lat-dLat],[c.lon+dLon,c.lat-dLat],[c.lon+dLon,c.lat+dLat],[c.lon-dLon,c.lat+dLat],[c.lon-dLon,c.lat-dLat]]] } };
}) };
const farCount = gridFC.features.filter(f => f.properties.far).length;

// ================= UI =================
function buildSeg(id, opts, key, cb) {
  const el = document.getElementById(id);
  for (const [k, lab] of Object.entries(opts)) {
    const b = document.createElement('button'); b.textContent = typeof lab === 'object' ? lab.label : lab; b.dataset.k = k;
    b.onclick = () => { S[key] = k; (cb || render)(); }; el.appendChild(b);
  }
}
buildSeg('slot', SLOTS, 'slot'); buildSeg('daytype', DAYS, 'daytype'); buildSeg('season', SEASONS, 'season'); buildSeg('pol', POLS, 'pol'); buildSeg('view', VIEWS, 'view');
const sel = document.getElementById('dist');
sel.innerHTML = '<option value="-1">全市</option>' + NAMES.map((n, i) => `<option value="${i}">${n}${D.features[i].properties.has_station ? '' : '（無測站）'}</option>`).join('');
sel.onchange = () => { S.dist = +sel.value; zoomToDist(); render(); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('section[data-p]').forEach(s => s.hidden = s.dataset.p !== t);
  if (t === 'plan') loadNet();
  if (window.__ready) { const op = t === 'aq' ? 0.5 : 0.08; map.setPaintProperty('dist-fill', 'fill-opacity', S.view === 'grid' ? 0 : op); map.setPaintProperty('grid-fill', 'fill-opacity', ['case', ['get', 'far'], op * 0.5, op + 0.1]); }
}
const R = { pick:null, start:null, end:null, major:'secondary' };   // 臺北多數幹道（信義路、仁愛路、南京東路…）在 OSM 標為 secondary
(() => { const mj = document.getElementById('major');
  for (const [k, l] of [['secondary', '快速＋主要＋次要道路'], ['primary', '只算快速＋主要道路']]) { const b = document.createElement('button'); b.textContent = l; b.dataset.k = k; b.onclick = () => { R.major = k; render(); }; mj.appendChild(b); }
  for (const id of ['rsFull', 'rsZero']) document.getElementById(id).addEventListener('change', () => render());
})();
const panel = document.getElementById('panel');
document.getElementById('fold').onclick = () => { const f = panel.classList.toggle('folded'); document.getElementById('fold').textContent = f ? '展開' : '收合'; };
document.getElementById('handle').onclick = () => document.getElementById('fold').click();

document.getElementById('src').innerHTML =
  `<b>資料來源</b>：臺北市政府環境保護局 12 個自動測站逐時資料（${AQ_META.period}，${AQ_META.rows.toLocaleString()} 筆）、測站基本資料、行道樹與公園樹、公園基本資料（臺北市資料大平臺，政府資料開放授權條款第 1 版）；` +
  `行政區界線；路網、幹道、公園面、商店、商業區 © OpenStreetMap contributors（ODbL）。底圖 © OpenFreeMap © OpenMapTiles © OpenStreetMap contributors。<br>` +
  `數值為該情境所有有效小時的平均；「-」與 AQI=0 當缺測。日子：${AQ_META.holiday_note}。氣象資料（臺北站 466920）缺少，未考慮風與降雨。`;

// ================= 地圖 =================
const map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty', center:[121.565, 25.06], zoom:11, attributionControl:{ compact:false } });
map.addControl(new maplibregl.NavigationControl(), 'top-right');
map.on('error', e => { const m = String(e && e.error && e.error.message || ''); if (/openfreemap|style/.test(m)) showErr('底圖載入失敗（需要網路），資料圖層仍可使用。'); });
function showErr(t) { const el = document.getElementById('err'); el.textContent = t; el.style.display = 'block'; }
const stFC = { type:'FeatureCollection', features: ST.map((s, i) => ({ type:'Feature', id:i, properties:{ i, name:s.name.replace('站', ''), type:s.type }, geometry:{ type:'Point', coordinates:[s.lon, s.lat] } })) };
const KY = 110950, kxAt = lat => 111320 * Math.cos(lat * Math.PI / 180);

// ---- 階段一要用的索引 ----

  for (let k = 0; k < NET.nE; k++) { if (box && (NET.mlon[k] < box[0] || NET.mlon[k] > box[2] || NET.mlat[k] < box[1] || NET.mlat[k] > box[3])) continue; const v = airArr[k]; if (v < mn) mn = v; if (v > mx) mx = v; }
  const w = Object.fromEntries(Object.entries(PREFS).map(([k, p]) => [k, p.w]));
  const avoid = new Float64Array(NET.nE), like = new Float64Array(NET.nE);
  for (let k = 0; k < NET.nE; k++) {
    const e = NET.E[k];
    avoid[k] = w.road * (1 - Math.min(Math.min(e[5], e[6]) / 200, 1))
             + w.comm * Math.min(1, 0.5 * e[8] + e[9] / 8)
             + w.air * (mx > mn ? Math.min(1, Math.max(0, (airArr[k] - mn) / (mx - mn))) : 0);
    like[k] = w.sw * (e[7] ? 1 : 0) + w.green * ((e[4] >= 0 || e[10]) ? 1 : 0) + w.shade * Math.min(NET.per100[k] / NET.p90, 1);
  }
  return { avoid, like };
}
function costWith(pen, lam) { const c = new Float64Array(NET.nE); for (let k = 0; k < NET.nE; k++) c[k] = NET.len[k] * (1 + lam * pen.avoid[k]) / (1 + lam * pen.like[k]); return c; }
function dijkstra(src, dst, cost) {
  const n = NET.nN, Dd = new Float64Array(n).fill(Infinity), prevE = new Int32Array(n).fill(-1), done = new Uint8Array(n), hN = [], hD = [];
  const push = (v, d) => { hN.push(v); hD.push(d); let i = hN.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (hD[p] <= hD[i]) break; [hN[p], hN[i]] = [hN[i], hN[p]]; [hD[p], hD[i]] = [hD[i], hD[p]]; i = p; } };
  const pop = () => { const v = hN[0], d = hD[0], ln = hN.pop(), ld = hD.pop(); if (hN.length) { hN[0] = ln; hD[0] = ld; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < hN.length && hD[l] < hD[m]) m = l; if (r < hN.length && hD[r] < hD[m]) m = r; if (m === i) break; [hN[m], hN[i]] = [hN[i], hN[m]]; [hD[m], hD[i]] = [hD[i], hD[m]]; i = m; } } return [v, d]; };
  Dd[src] = 0; push(src, 0);
  while (hN.length) { const [u, d] = pop(); if (done[u]) continue; done[u] = 1; if (u === dst) break;
    for (let a = NET.deg[u]; a < NET.deg[u + 1]; a++) { const v = NET.adjN[a], k = NET.adjE[a], nd = d + cost[k]; if (nd < Dd[v]) { Dd[v] = nd; prevE[v] = k; push(v, nd); } } }
  if (!isFinite(Dd[dst])) return null;
  const edges = [], nodes = [dst]; let v = dst;
  while (v !== src) { const k = prevE[v]; edges.push(k); const e = NET.E[k]; v = e[0] === v ? e[1] : e[0]; nodes.push(v); }
  edges.reverse(); nodes.reverse();
  let L = 0; for (const k of edges) L += NET.len[k];
  return { edges, nodes, L };
}
function pathCoords(p) {
  const out = [[NET.lon[p.nodes[0]], NET.lat[p.nodes[0]]]];
  p.edges.forEach((k, i) => { const a = p.nodes[i], b = p.nodes[i + 1], g = NET.GM[k], mid = [];
    for (let j = 0; j < g.length; j += 2) mid.push([g[j] / 1e5, g[j + 1] / 1e5]);
    if (NET.E[k][0] !== a) mid.reverse();
    out.push(...mid, [NET.lon[b], NET.lat[b]]); });
  return out;
}
function nearestNode(ll) {
  let best = -1, bd = Infinity; const kx = Math.cos(ll.lat * Math.PI / 180);
  for (let i = 0; i < NET.nN; i++) { const dx = (NET.lon[i] - ll.lng) * kx, dy = NET.lat[i] - ll.lat, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return { i: best, m: Math.sqrt(bd) * 111000 };
}
function routeStats(p, air) {
  let L = 0, aqi = 0, pm = 0, no2 = 0, sw = 0, river = 0, comm = 0, near = 0, near1 = 0, trees = 0, shopsN = 0; const parks = new Set();
  for (const k of p.edges) { const e = NET.E[k], l = NET.len[k];
    L += l; aqi += air.AQI[k] * l; pm += air['PM2.5'][k] * l; no2 += air.NO2[k] * l; trees += e[3];
    if (e[7]) sw += l; if (e[10]) river += l; if (e[8] || e[9] >= 3) comm += l; if (Math.min(e[5], e[6]) <= 50) near += l; if (e[5] <= 50) near1 += l; if (e[4] >= 0) parks.add(e[4]); shopsN += e[9]; }
  return { km: L / 1000, aqi: aqi / L, pm: pm / L, no2: no2 / L, swPct: sw / L * 100, riverPct: river / L * 100, commPct: comm / L * 100, nearPct: near / L * 100, near1Pct: near1 / L * 100,
    per100: trees / L * 100, shade: Math.min(trees / L * 100 / NET.p90, 1) * 100, parks: [...parks].map(i => window.NET_PARKS[i]) };
}
function setPoint(kind, ll) {
  if (!NET) { netStatus('路網還在載入，請稍等。'); return; }
  const n = nearestNode(ll); R[kind] = n.i; R.pick = null; map.getCanvas().style.cursor = '';
  document.querySelectorAll('#pickStart,#pickEnd').forEach(b => b.classList.remove('on'));
  document.getElementById('pickHint').textContent = n.m > 150 ? `⚠ 點的位置離最近可跑的路 ${Math.round(n.m)} m，已吸附到最近的路。` : (kind === 'start' && R.end === null ? '起點已設定，請按②設終點。' : '已吸附到最近的路網節點。');
  routeUpdate();
}
function summaryText(s) {
  const parts = [`${s.swPct.toFixed(0)}% 走人行道`, s.parks.length ? `經過 ${s.parks.length} 個公園` : '沒有經過公園',
    s.riverPct >= 1 ? `${s.riverPct.toFixed(0)}% 在河濱` : null, s.commPct < 0.5 ? '完全避開商圈' : `${s.commPct.toFixed(0)}% 經過商圈`,
    s.nearPct < 0.5 ? '完全避開大車道' : `${s.nearPct.toFixed(0)}% 靠近大車道（50 m 內）`];
  return parts.filter(Boolean).join('、');
}
function routeUpdate() {
  if (!NET || !window.__ready || !map.getSource('pts')) return;
  const pts = [];
  if (R.start !== null) pts.push({ type:'Feature', properties:{ k:'start' }, geometry:{ type:'Point', coordinates:[NET.lon[R.start], NET.lat[R.start]] } });
  if (R.end !== null) pts.push({ type:'Feature', properties:{ k:'end' }, geometry:{ type:'Point', coordinates:[NET.lon[R.end], NET.lat[R.end]] } });
  map.getSource('pts').setData({ type:'FeatureCollection', features:pts });
  const out = document.getElementById('routeOut');
  if (R.start === null || R.end === null) { map.getSource('route').setData({ type:'FeatureCollection', features:[] }); out.innerHTML = ''; window.__route = null; return; }
  const t0 = performance.now();
  const air = { AQI: edgeAir('AQI'), 'PM2.5': edgeAir('PM2.5'), NO2: edgeAir('NO2') };
  const airSel = S.pol in air ? air[S.pol] : edgeAir(S.pol);
  const short = dijkstra(R.start, R.end, NET.len);
  if (!short) { out.innerHTML = '<div class="warn">兩點之間的路網不連通，請換一個點。</div>'; return; }
  const pen = penalties(airSel, corridor(R.start, R.end)), ratio = Math.max(1, +document.getElementById('maxRatio').value || 1.3);
  const withL = lam => dijkstra(R.start, R.end, costWith(pen, lam));
  let lam = 1, best = withL(1), runs = 2;
  if (best.L > ratio * short.L) {   // 超過長度上限：二分法調小偏好強度 λ
    let lo = 0, hi = 1, ok = short; lam = 0;
    for (let it = 0; it < 9; it++) { const mid = (lo + hi) / 2, p = withL(mid); runs++; if (p.L <= ratio * short.L) { ok = p; lam = mid; lo = mid; } else hi = mid; }
    best = ok;
  }
  map.getSource('route').setData({ type:'FeatureCollection', features:[
    { type:'Feature', properties:{ kind:'short' }, geometry:{ type:'LineString', coordinates:pathCoords(short) } },
    { type:'Feature', properties:{ kind:'best' }, geometry:{ type:'LineString', coordinates:pathCoords(best) } }] });
  const a = routeStats(best, air), b = routeStats(short, air), same = best.edges.join() === short.edges.join();
  window.__route = { best:a, short:b, lam, runs, ms: Math.round(performance.now() - t0), same, ratio: a.km / b.km };
  const row = (lab, fa, fb, better) => { const va = fa(a), vb = fa(b); return `<tr><th>${lab}</th><td class="num" style="color:${C.coral}">${va}</td><td class="num" style="color:${C.grey}">${vb}</td></tr>`; };
  out.innerHTML = `<div class="card"><h3>路線比較 <span class="tag">${SEASON_FULL[S.season]}・${DAYS[S.daytype]}・${SLOT_FULL[S.slot]}</span></h3>` +
    `<div class="summary"><b style="color:${C.coral}">建議路線</b>：${summaryText(a)}。<br><b style="color:${C.grey}">最短路線</b>：${summaryText(b)}。</div>` +
    `<table class="t"><tr><th></th><th style="color:${C.coral}">━ 建議</th><th style="color:${C.grey}">┅ 最短</th></tr>` +
    row('距離 km', s => s.km.toFixed(2)) + row('預估時間（6 分/km）', s => hms(s.km * 6)) +
    row('平均 AQI（推估）', s => s.aqi.toFixed(1)) + row('平均 PM2.5', s => s.pm.toFixed(1)) + row('平均 NO₂ ppb', s => s.no2.toFixed(1)) +
    row('🚗 大車道 50 m 內', s => s.nearPct.toFixed(0) + '%') + row('　其中快速／主要道路', s => s.near1Pct.toFixed(0) + '%') + row('🛍️ 商圈路段', s => s.commPct.toFixed(0) + '%') +
    row('🚶 人行道', s => s.swPct.toFixed(0) + '%') + row('🌿 經過公園', s => s.parks.length + ' 個') + row('🌊 河濱', s => s.riverPct.toFixed(0) + '%') +
    row('🌳 樹蔭分數（0–100）', s => s.shade.toFixed(0)) + row('🌳 每 100 m 樹數', s => s.per100.toFixed(1)) + '</table>' +
    (a.parks.length ? `<div class="note">建議路線經過：${a.parks.slice(0, 6).join('、')}${a.parks.length > 6 ? '…' : ''}</div>` : '') +
    `<div class="note">建議路線長度是最短路線的 <b class="num">${(a.km / b.km).toFixed(2)}</b> 倍（上限 ${ratio} 倍）${lam < 1 ? `；為了不超過上限，偏好強度自動調降為 ${(lam * 100).toFixed(0)}%` : ''}。${same ? '<b>兩條路線相同</b>：在這組偏好下最短路線已是最佳。' : ''}計算 ${window.__route.ms} ms。</div>` +
    `<div class="note">空品為推估（IDW＋路邊加成），樹蔭以 20 m 內行道樹與公園樹數量代理。人行道與商店依 OSM 標記，標記不完整（見上方說明）。快速道路（motorway、trunk）與高架橋（bridge=viaduct）已從路網排除。</div></div>`;
}
document.getElementById('pickStart').onclick = () => { loadNet(); DR.active = false; R.pick = 'start'; map.getCanvas().style.cursor = 'crosshair'; document.getElementById('pickStart').classList.add('on'); document.getElementById('pickHint').textContent = '請在地圖上點起點。'; };
document.getElementById('pickEnd').onclick = () => { loadNet(); DR.active = false; R.pick = 'end'; map.getCanvas().style.cursor = 'crosshair'; document.getElementById('pickEnd').classList.add('on'); document.getElementById('pickHint').textContent = '請在地圖上點終點。'; };
document.getElementById('clearRoute').onclick = () => { R.start = R.end = null; R.pick = null; routeUpdate(); };

render();
</script>
