<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臺北跑者空品地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl-4.7.1.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/web/aq_data.js"></script>
<script src="data/web/grid.js"></script>
<script src="data/web/trees.js"></script>
<script src="data/web/parks.js"></script>
<script src="data/web/roads.js"></script>
<script src="data/web/osm_coverage.js"></script>
<style>
  /* ===== 設計系統：白底＋溫和漸層＋科技感 =====
     漸層只用在有資料變化的地方（空氣品質：藍＝好 → 紅＝差）；螢光綠 #c6ff3d 只用在路線；其他元件用溫和的深墨、灰
     字體：中文 Noto Sans TC；數字與英文標籤 Barlow／Barlow Semi Condensed */
  :root {
    --ink:#121826; --ink2:#3a4256; --muted:#8a93a6; --line:#eceef3; --bg:#f5f6fa; --card:#ffffff;
    --lime:#c6ff3d;   /* 只給路線 */
    --shadow:0 10px 30px rgba(18,24,38,.08), 0 2px 6px rgba(18,24,38,.05);
    --r:22px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.55 "Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .num { font-family:"Barlow","Noto Sans TC",sans-serif; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .en { font-family:"Barlow Semi Condensed","Barlow",sans-serif; font-weight:600; letter-spacing:.14em; text-transform:uppercase; font-size:10.5px; color:var(--muted); }
  #map { position:absolute; inset:0; }
  .panel { background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); }
  /* ---- 桌機：左＝主要、右＝次要摺疊、下＝時間軸 ---- */
  #main { position:absolute; top:16px; left:16px; width:364px; max-height:calc(100% - 224px); overflow:auto; z-index:3; }
  #side { position:absolute; top:16px; right:58px; width:330px; max-height:calc(100% - 224px); overflow:auto; z-index:3; display:flex; flex-direction:column; gap:10px; background:transparent; box-shadow:none; }
  #timebar { position:absolute; left:396px; right:16px; bottom:16px; z-index:3; padding:12px 16px 10px; }
  #head { padding:16px 18px 6px; position:relative; }
  #head h1 { font-size:19px; margin:0; display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.02em; }
  #head .sub { margin:2px 0 0 38px; }
  .sun { width:26px; height:26px; border-radius:50%; border:6px solid var(--ink); position:relative; flex:none; }
  .sun::after { content:''; position:absolute; right:-6px; top:-6px; width:9px; height:9px; border-radius:50%; background:#5b8fd1; border:2px solid #fff; }
  #fold, #handle { display:none; }
  .body { padding:8px 18px 18px; }
  .seg { display:flex; flex-wrap:wrap; gap:6px; }
  .seg button, .btn { flex:1 1 auto; background:var(--bg); color:var(--ink2); border:0; border-radius:14px; padding:8px 10px; font:500 13px "Noto Sans TC"; cursor:pointer; min-height:38px; transition:background .15s, color .15s, transform .1s; }
  .seg button:hover, .btn:hover { background:#eceef4; }
  .seg button:active, .btn:active { transform:scale(.98); }
  .seg button.on { background:var(--ink); color:#fff; font-weight:600; }
  .seg.small button { min-height:30px; padding:4px 11px; font-size:12.5px; flex:0 0 auto; border-radius:999px; }
  #mode { background:var(--bg); padding:4px; border-radius:16px; gap:4px; }
  #mode button { background:transparent; }
  #mode button.on { background:#fff; color:var(--ink); box-shadow:0 2px 8px rgba(18,24,38,.1); }
  .btn.primary { background:var(--ink); color:#fff; font-weight:600; }
  .btn.primary:hover { background:#2a3245; }
  .btn.on { background:var(--ink); color:#fff; font-weight:600; box-shadow:0 0 0 3px #d5dae5; }
  .btn.ghost { background:transparent; border:1.5px solid var(--line); }
  .btn.go { background:var(--ink); color:#fff; font-weight:600; width:100%; margin-top:10px; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .lab { font-size:12px; color:var(--muted); margin:12px 0 6px; font-weight:500; display:flex; align-items:baseline; gap:8px; }
  .note { font-size:11.5px; color:var(--muted); margin-top:6px; }
  .warn { font-size:12px; color:#8a4b00; background:#fff6e8; border-radius:12px; padding:8px 10px; margin-top:10px; }
  .toggles { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .tg { display:flex; align-items:center; gap:8px; background:var(--bg); border-radius:14px; padding:8px 10px; cursor:pointer; font-size:12.5px; user-select:none; color:var(--ink2); }
  .tg .sw2 { width:30px; height:18px; border-radius:9px; background:#d9dce4; position:relative; flex:none; transition:.15s; }
  .tg .sw2::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
  .tg.on { background:#fff; box-shadow:inset 0 0 0 1.5px var(--ink); color:var(--ink); font-weight:500; }
  .tg.on .sw2 { background:var(--ink); } .tg.on .sw2::after { left:14px; background:#fff; }
  /* 弧形儀表 */
  #gauge { display:flex; align-items:center; gap:12px; margin-top:14px; }
  #gauge svg { flex:none; }
  #gauge .gv { font-family:"Barlow",sans-serif; font-weight:500; }
  #gauge .side { flex:1; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; background:var(--bg); }
  .chip i { width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 2px rgba(0,0,0,.06); }
  #advice { border-radius:16px; padding:12px 14px 12px 16px; margin-top:12px; font-size:14px; line-height:1.65; background:var(--bg); position:relative; }
  #advice::before { content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--ink); }
  #advice b { color:var(--ink); font-weight:700; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .kpi { background:var(--bg); border-radius:16px; padding:10px 12px; }
  .kpi .v { font-size:26px; line-height:1.05; display:block; font-weight:500; }
  .kpi small { display:block; font-size:11px; color:var(--muted); margin-top:4px; }
  .kpi input { width:44px; padding:1px 4px; font:600 12px "Barlow"; border:0; border-radius:6px; background:#fff; }
  /* 摺疊面板 */
  .fold-s { background:#fff; border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  .fold-h { width:100%; display:flex; align-items:center; justify-content:space-between; border:0; background:#fff; padding:13px 16px; font:600 14px "Noto Sans TC"; color:var(--ink); cursor:pointer; gap:8px; }
  .fold-h .en { margin-left:auto; }
  .fold-h .arr { transition:transform .2s; color:var(--muted); font-size:12px; width:22px; height:22px; border-radius:50%; background:var(--bg); display:inline-flex; align-items:center; justify-content:center; }
  .fold-s.open .fold-h .arr { transform:rotate(90deg); background:var(--ink); color:#fff; }
  .fold-b { display:none; padding:0 16px 16px; max-height:56vh; overflow:auto; }
  .fold-s.open .fold-b { display:block; }
  table.t { border-collapse:collapse; font-size:12.5px; width:100%; margin-top:6px; }
  table.t td, table.t th { border-bottom:1px solid var(--line); padding:6px 6px; text-align:right; }
  table.t th:first-child { text-align:left; font-weight:500; color:var(--muted); }
  table.t td.num { font-size:14px; }
  .switch { display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; margin:6px 0; }
  .switch input { width:18px; height:18px; accent-color:var(--ink); }
  select, input[type=number] { background:var(--bg); color:var(--ink); border:0; border-radius:10px; padding:6px 8px; font:500 13px "Noto Sans TC"; }
  input[type=range] { accent-color:var(--ink); }
  .pref { display:grid; grid-template-columns:22px 1fr 22px 90px 34px; align-items:center; gap:6px; margin:6px 0; font-size:13px; }
  .tag { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--bg); color:var(--muted); margin-left:6px; font-weight:500; }
  .tag.est { background:#fff1e0; color:#a35200; }
  svg text { fill:var(--muted); font-size:10.5px; font-family:"Barlow","Noto Sans TC",sans-serif; }
  /* 時間軸 */
  .tb-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #play { width:42px; height:42px; border-radius:50%; border:0; background:var(--ink); color:#fff; font-size:15px; cursor:pointer; flex:none; box-shadow:0 4px 12px rgba(18,24,38,.2); }
  #clock { font:500 30px "Barlow"; min-width:82px; color:var(--ink); letter-spacing:-.01em; line-height:1; }
  #tbTitle { font-size:12px; color:var(--muted); flex:1; min-width:160px; }
  #curve { display:block; width:100%; height:80px; margin-top:6px; cursor:pointer; }
  #hour { -webkit-appearance:none; appearance:none; width:100%; height:24px; background:transparent; margin:2px 0 0; cursor:pointer; }
  #hour::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:#e1e5ee; }
  #hour::-moz-range-track { height:6px; border-radius:3px; background:#e1e5ee; }
  #hour::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; background:#fff; border:4px solid var(--ink); box-shadow:0 3px 10px rgba(18,24,38,.25); }
  #hour::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; border:4px solid var(--ink); box-shadow:0 3px 10px rgba(18,24,38,.25); }
  #hourTicks { display:flex; justify-content:space-between; font:600 10.5px "Barlow Semi Condensed"; color:var(--muted); padding:0 6px; letter-spacing:.06em; }
  #legend { display:flex; align-items:center; gap:4px; flex-wrap:wrap; font-size:11.5px; color:var(--ink2); }
  #legend .c { display:inline-flex; align-items:center; gap:4px; margin-right:8px; }
  #legend .c i { width:10px; height:10px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1.5px rgba(0,0,0,.08); }
  #relWarn { font-size:11.5px; color:#8a4b00; background:#fff6e8; border-radius:999px; padding:3px 10px; }
  .maplibregl-popup-content { background:#fff; color:var(--ink); font-size:12.5px; border-radius:14px; box-shadow:var(--shadow); padding:10px 13px; }
  .maplibregl-ctrl-group { border-radius:14px !important; box-shadow:var(--shadow) !important; overflow:hidden; }
  #err { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%); background:#fff1f0; color:#a8071a; padding:8px 14px; border-radius:999px; z-index:5; box-shadow:var(--shadow); }
  [hidden] { display:none !important; }
  /* ---- 手機：全部收進底部抽屜 ---- */
  @media (max-width:700px) {
    #ui { position:absolute; left:0; right:0; bottom:0; max-height:62%; overflow:auto; z-index:3; background:var(--card); border-radius:24px 24px 0 0; box-shadow:0 -8px 28px rgba(18,24,38,.12); display:flex; flex-direction:column; }
    #main, #side, #timebar { position:static; width:auto; max-height:none; overflow:visible; box-shadow:none; border-radius:0; }
    #main { order:1; } #timebar { order:2; padding:8px 14px; border-top:1px solid var(--line); } #side { order:3; padding:10px 12px 16px; background:var(--bg); }
    #head { padding:8px 16px 2px; } #head .sub { display:none; }
    #fold { display:block; position:absolute; top:10px; right:12px; border:0; background:var(--bg); border-radius:999px; padding:5px 12px; font:600 12px "Noto Sans TC"; color:var(--ink); }
    #handle { display:block; width:40px; height:5px; border-radius:3px; background:#d9dce4; margin:0 auto 8px; }
    #main .body { padding:6px 14px 10px; }
    #gauge { margin-top:8px; }
    #ui.folded #side, #ui.folded .more { display:none; }
    #ui.folded #tbTitle, #ui.folded #daytype, #ui.folded #season, #ui.folded #cmode, #ui.folded #hourTicks, #ui.folded #timebar .tb-row:last-child, #ui.folded #advice .note, #ui.folded #advice br, #ui.folded #gauge { display:none; }
    #ui.folded .kpi { padding:6px 10px; } #ui.folded .kpi .v { font-size:21px; } #ui.folded #curve { height:58px; }
    #clock { font-size:24px; }
    .fold-b { max-height:none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<div id="ui">
  <!-- ===== 主要 ===== -->
  <div id="main" class="panel">
    <div id="head"><div id="handle"></div><h1><span class="sun"></span>臺北跑者空品地圖</h1><div class="sub en">Taipei Run · Air Quality</div><button id="fold">收合</button></div>
    <div class="body">
      <div class="seg more" id="mode"><button data-k="draw">✏️ 自己畫路線</button><button data-k="plan">🧭 起點→終點規劃</button></div>
      <div id="drawCtl" class="more">
        <div class="btns"><button class="btn primary" id="drawStart">開始畫線</button><button class="btn" id="drawUndo">復原</button><button class="btn" id="drawClear">清除</button><button class="btn" id="drawEnd">完成</button></div>
      </div>
      <div id="planCtl" class="more" hidden>
        <div class="btns"><button class="btn" id="pickStart">① 設起點</button><button class="btn" id="pickEnd">② 設終點</button><button class="btn ghost" id="clearRoute">清除</button></div>
        <div class="lab">偏好 <span class="en">Preferences</span></div>
        <div class="toggles" id="mainPrefs"></div>
        <button class="btn go" id="replan" hidden>用這個時間重新規劃</button>
      </div>
      <div class="note more" id="hint"></div>
      <div id="gauge"></div>
      <div id="advice"></div>
      <div class="kpis" id="kpis"></div>
    </div>
  </div>

  <!-- ===== 次要：摺疊面板（預設收起，記住狀態） ===== -->
  <div id="side" class="panel">
    <section class="fold-s" data-f="detail"><button class="fold-h">詳細數據<span class="en">Details</span><span class="arr">›</span></button><div class="fold-b" id="detail"></div></section>
    <section class="fold-s" data-f="city"><button class="fold-h">城市空品圖層<span class="en">City layers</span><span class="arr">›</span></button><div class="fold-b" id="city"></div></section>
    <section class="fold-s" data-f="adv"><button class="fold-h">進階偏好與設定<span class="en">Settings</span><span class="arr">›</span></button><div class="fold-b" id="adv"></div></section>
    <section class="fold-s" data-f="about"><button class="fold-h">資料說明<span class="en">About data</span><span class="arr">›</span></button><div class="fold-b" id="about"></div></section>
  </div>

  <!-- ===== 時間軸 ===== -->
  <div id="timebar" class="panel">
    <div class="tb-row">
      <button id="play" aria-label="播放一整天">▶</button>
      <span id="clock" class="num">08:00</span>
      <span id="tbTitle"></span>
      <div class="seg small" id="daytype"></div>
      <div class="seg small" id="season"></div>
      <div class="seg small" id="cmode"></div>
    </div>
    <svg id="curve" role="img" aria-label="24 小時曲線"></svg>
    <input id="hour" type="range" min="0" max="23" step="1" value="8" aria-label="時間（0–23 點）">
    <div id="hourTicks"></div>
    <div class="tb-row" style="margin-top:4px"><div id="legend"></div><span id="relWarn" hidden>⚠ 相對比較：顏色只代表這個情境 24 小時內的相對好壞，<b>不代表空氣不健康</b></span></div>
  </div>
</div>

<script>
// ===================================================================
// 常數與狀態
// ===================================================================
// 空品色：藍＝好 → 紅＝差。分級界線照環境部 AQI（0–50 良好、51–100 普通、101–150 對敏感族群不健康…），色彩改用溫和的藍紅色階
const OFFICIAL = [[50, '#3f7fc8', '良好'], [100, '#9fc0e4', '普通'], [150, '#f0a582', '對敏感族群不健康'], [200, '#d9534f', '對所有族群不健康'], [300, '#a33a4f', '非常不健康'], [Infinity, '#6e2337', '危害']];
const REL_STOPS = [[0, [63, 127, 200]], [0.4, [159, 192, 228]], [0.6, [240, 196, 176]], [1, [217, 83, 79]]];   // 相對比較：藍→淺藍→淺紅→紅
const MISSING = '#c4c8cf';
const POLS = { AQI:{ label:'AQI', unit:'' }, NO2:{ label:'NO₂', unit:'ppb' }, 'PM2.5':{ label:'PM2.5', unit:'μg/m³' }, O3:{ label:'O₃', unit:'ppb' } };
const SEASONS = { all:'全年', winter:'冬', spring:'春', summer:'夏', autumn:'秋' };
const SEASON_FULL = { all:'全年', winter:'冬季 12–2 月', spring:'春季 3–5 月', summer:'夏季 6–8 月', autumn:'秋季 9–11 月' };
const DAYS = { weekday:'平日', holiday:'假日' };
const PEAK_H = [7, 8, 17, 18], OFF_H = [5, 6, 11, 12, 19, 20, 21];
const C = { coral:'#e07a5f', green:'#2e9e6b', sky:'#5b8fd1', grey:'#8a93a6', ink:'#121826', lime:'#c6ff3d' };   // 螢光綠只給路線
const ST = window.AQ_STATIONS, G = window.GRID, D = window.DISTRICTS, RSH = window.AQ_ROADSIDE_H, AQH = window.AQ_H;
const NAMES = D.features.map(f => f.properties.name);
const USE = ST.map(s => s.type === '一般站');   // IDW 只用 9 個一般站
const KY = 110950, kxAt = lat => 111320 * Math.cos(lat * Math.PI / 180);
const pad2 = n => String(n).padStart(2, '0');
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); };
const hmsDur = m => { const s = Math.round(m * 60), h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + pad2(mm) : mm) + ':' + pad2(ss); };
const fmt = v => v === null || v === undefined || Number.isNaN(v) ? '缺值' : (+v).toFixed(1);
const unit = p => POLS[p].unit ? ' ' + POLS[p].unit : '';
// 預設＝臺北現在時刻；週六日視為假日（國定假日未判斷）
const nowTP = (() => { const f = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Taipei', hour:'numeric', hourCycle:'h23', weekday:'short' }).formatToParts(new Date());
  return { hour: +f.find(p => p.type === 'hour').value % 24, wk: f.find(p => p.type === 'weekday').value }; })();
const S = { pol:'AQI', season:'all', daytype: (nowTP.wk === 'Sat' || nowTP.wk === 'Sun') ? 'holiday' : 'weekday', hour: nowTP.hour, color:'official', mode:'draw', dist:-1, pace:6 };
const R = { pick:null, start:null, end:null, rsOn:true, major:'secondary', rsFull:50, rsZero:150, maxRatio:1.3 };   // 路邊加成：只有一個開關，其餘固定   // 臺北多數幹道在 OSM 標為 secondary
const store = { get(k, d) { try { const v = localStorage.getItem('runmap.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('runmap.' + k, JSON.stringify(v)); } catch (e) {} } };

// ===================================================================
// 空品：測站小時值、IDW、路邊加成
// ===================================================================
const stV = (pol, h) => AQH[pol][S.season][S.daytype].v[h];
const stN = (pol, h) => AQH[pol][S.season][S.daytype].n[h];
const rsH = (pol, h) => RSH.values[pol][S.season][S.daytype].mean[h] || 0;
const lowSample = h => Math.min(...stN('AQI', h).filter((_, i) => USE[i])) < AQ_META.min_n;
function idw(dist, vals) { let num = 0, den = 0;
  for (let i = 0; i < vals.length; i++) { const v = vals[i]; if (v === null || !USE[i]) continue; const d = dist[i]; if (d < 1) return v; const w = 1 / (d * d); num += w * v; den += w; }
  return den ? num / den : null; }
function rsF(d) { if (!R.rsOn) return 0; const full = R.rsFull, zero = Math.max(R.rsZero, full + 1); return d <= full ? 1 : d >= zero ? 0 : (zero - d) / (zero - full); }
const dMajOf = (d1, d2) => R.major === 'primary' ? d1 : Math.min(d1, d2);
const gridAt = (pol, h) => { const sv = stV(pol, h); return G.map(c => idw(c.dist, sv)); };
function distAt(gv) { const sum = Array(NAMES.length).fill(0), n = Array(NAMES.length).fill(0);

function paintRoute() {   // 路線每一段依目前時間上色，並標出最差路段

  map.getSource('seg').setData({ type:'FeatureCollection', features:feats });

  Dd[src] = 0; push(src, 0);
  while (hN.length) { const [u, d] = pop(); if (done[u]) continue; done[u] = 1; if (u === dst) break;
    for (let a = NET.deg[u]; a < NET.deg[u + 1]; a++) { const v = NET.adjN[a], k = NET.adjE[a], nd = d + cost[k]; if (nd < Dd[v]) { Dd[v] = nd; prevE[v] = k; push(v, nd); } } }
  if (!isFinite(Dd[dst])) return null;
  const edges = [], nodes = [dst]; let v = dst;
  while (v !== src) { const k = prevE[v]; edges.push(k); const e = NET.E[k]; v = e[0] === v ? e[1] : e[0]; nodes.push(v); }
  edges.reverse(); nodes.reverse(); let L = 0; for (const k of edges) L += NET.len[k];
  return { edges, nodes, L };
}
function edgeCoords(k, from) { const e = NET.E[k], g = NET.GM[k], mid = []; for (let j = 0; j < g.length; j += 2) mid.push([g[j] / 1e5, g[j + 1] / 1e5]);
  const cs = [[NET.lon[e[0]], NET.lat[e[0]]], ...mid, [NET.lon[e[1]], NET.lat[e[1]]]]; return e[0] === from ? cs : cs.reverse(); }
function pathModel(p, kind) { const m = ST.length;
  const segs = p.edges.map((k, i) => { const e = NET.E[k]; return { c: edgeCoords(k, p.nodes[i]), L: NET.len[k], dSt: Array.from(NET.dist.subarray(k * m, k * m + m)), d1:e[5], d2:e[6],
    park: e[4] >= 0, pname: e[4] >= 0 ? window.NET_PARKS[e[4]] : null, sw: e[7], comm: (e[8] || e[9] >= 3) ? 1 : 0, river: e[10], trees: e[3] }; });
  return makeModel(kind, segs); }
function nearestNode(ll) { let best = -1, bd = Infinity; const kx = Math.cos(ll.lat * Math.PI / 180);
  for (let i = 0; i < NET.nN; i++) { const dx = (NET.lon[i] - ll.lng) * kx, dy = NET.lat[i] - ll.lat, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return { i: best, m: Math.sqrt(bd) * 111000 }; }
function showPts() { if (!window.__ready || !NET) return; const pts = [];
  if (R.start !== null) pts.push({ type:'Feature', properties:{ k:'start' }, geometry:{ type:'Point', coordinates:[NET.lon[R.start], NET.lat[R.start]] } });
  if (R.end !== null) pts.push({ type:'Feature', properties:{ k:'end' }, geometry:{ type:'Point', coordinates:[NET.lon[R.end], NET.lat[R.end]] } });
  map.getSource('pts').setData({ type:'FeatureCollection', features:pts }); }
function setPoint(kind, ll) {
  if (!NET) { hint('路網還在載入，請稍等再點一次。'); return; }
  const n = nearestNode(ll); R[kind] = n.i; R.pick = null; map.getCanvas().style.cursor = '';
  document.querySelectorAll('#pickStart,#pickEnd').forEach(b => b.classList.remove('on')); showPts();
  if (R.start !== null && R.end !== null) planRoute();
  else hint((n.m > 150 ? `⚠ 點的位置離最近可跑的路 ${Math.round(n.m)} m，已吸附。` : '') + (kind === 'start' ? '起點已設定，請按「② 設終點」再點地圖。' : '終點已設定，請按「① 設起點」。'));
}
function planRoute() {
  if (!window.__ready) { map.once('load', () => setTimeout(planRoute, 0)); return; }   // 路網比底圖先載完時，等地圖好了再畫
  const t0 = performance.now(), h = S.hour, air = edgeAir(S.pol, h), short = dijkstra(R.start, R.end, NET.len);
  if (!short) { hint('兩點之間的路網不連通，請換一個點。'); return; }
  const pen = penalties(air, corridor(R.start, R.end)), ratio = Math.max(1, R.maxRatio), withL = lam => dijkstra(R.start, R.end, costWith(pen, lam));
  let lam = 1, best = withL(1), runs = 2;
  if (best.L > ratio * short.L) { let lo = 0, hi = 1, ok = short; lam = 0; for (let it = 0; it < 9; it++) { const mid = (lo + hi) / 2, p = withL(mid); runs++; if (p.L <= ratio * short.L) { ok = p; lam = mid; lo = mid; } else hi = mid; } best = ok; }
  ROUTE = pathModel(best, 'plan'); ROUTE.lam = lam; SHORT = pathModel(short, 'short');
  PLAN = { key: planKey(), hour:h, ms: Math.round(performance.now() - t0), runs };
  map.getSource('short').setData({ type:'FeatureCollection', features:[{ type:'Feature', properties:{}, geometry:{ type:'LineString', coordinates: SHORT.segs.flatMap(s => s.c) } }] });
  document.getElementById('replan').hidden = true;
  hint(`已用 ${pad2(h)}:00 的空品規劃（${PLAN.ms} ms）。彩色＝建議路線，灰色虛線＝最短路線。拖動時間軸可看各時間的顏色。`);
  window.__route = { best: stats(ROUTE, h * 60), short: stats(SHORT, h * 60), lam, ms: PLAN.ms, hour:h };
  applyLayers(); render(); fitRoute();
}
const planKey = () => [S.hour, S.pol, S.season, S.daytype, R.rsOn, R.major, R.rsFull, R.rsZero, R.maxRatio, Object.keys(PREFS).map(effW).join(',')].join('|');
function markStale(why) {   // 規劃後若時間或條件改變：只顯示按鈕，不自動重算（避免拖動時卡頓）
  if (S.mode !== 'plan' || !PLAN) return;
  const b = document.getElementById('replan'), stale = planKey() !== PLAN.key;
  b.hidden = !stale; if (stale) b.textContent = `用 ${pad2(S.hour)}:00 重新規劃` + (why ? `（${why}）` : '');
}
document.getElementById('replan').onclick = () => { if (NET && R.start !== null && R.end !== null) planRoute(); };
document.getElementById('pickStart').onclick = () => { loadNet(); DR.active = false; R.pick = 'start'; map.getCanvas().style.cursor = 'crosshair'; document.getElementById('pickStart').classList.add('on'); hint('請在地圖上點起點。'); };
document.getElementById('pickEnd').onclick = () => { loadNet(); DR.active = false; R.pick = 'end'; map.getCanvas().style.cursor = 'crosshair'; document.getElementById('pickEnd').classList.add('on'); hint('請在地圖上點終點。'); };
document.getElementById('clearRoute').onclick = () => { R.start = R.end = null; R.pick = null; ROUTE = SHORT = PLAN = null; document.getElementById('replan').hidden = true; clearMapRoute(); applyLayers(); render(); hint('已清除。'); };

// ===================================================================
// 彈出視窗
// ===================================================================
function stationPopup(i, ll) {
  const s = ST[i], v = stV(S.pol, S.hour)[i], n = stN(S.pol, S.hour)[i], ti = RSH.traffic.indexOf(s.name);
  const rs = ti >= 0 ? RSH.values[S.pol][S.season][S.daytype].per[S.hour][ti] : null;
  new maplibregl.Popup({ maxWidth:'320px' }).setLngLat(ll).setHTML(`<b>${s.name}</b>（${s.type}）<br><span class="note">${s.addr}</span><br>${pad2(S.hour)}:00 ${POLS[S.pol].label} <b class="num" style="font-size:16px">${fmt(v)}</b>${unit(S.pol)}　<span class="note">實測平均，${n} 筆</span>` +
    (ti >= 0 ? `<br>路邊加成（本站 − ${RSH.neighbors[s.name].join('、')}）：<b class="num">${rs === null ? '缺值' : (rs >= 0 ? '+' : '') + rs.toFixed(1)}</b>${unit(S.pol)}` : '')).addTo(map);
}
function distPopup(i, ll) { const f = D.features[i].properties, v = window.__cur.district[i];
  new maplibregl.Popup().setLngLat(ll).setHTML(`<b>${f.name}</b><br>${pad2(S.hour)}:00 ${POLS[S.pol].label} <b class="num" style="font-size:16px">${fmt(v)}</b>${unit(S.pol)}<br><span class="note">IDW 推估（區內網格平均）。${f.has_station ? '區內測站：' + f.stations : '區內沒有測站'}</span>`).addTo(map); }
function gridPopup(p, ll) { const v = gridAt(S.pol, S.hour)[p.i];
  new maplibregl.Popup().setLngLat(ll).setHTML(`500 m 網格（${NAMES[p.d]}）<br>${pad2(S.hour)}:00 ${POLS[S.pol].label} <b class="num" style="font-size:16px">${fmt(v)}</b>${unit(S.pol)}<br><span class="note">IDW 推估；最近一般站 ${p.near_st}，${(p.near_m / 1000).toFixed(1)} km${p.far ? '（遠離測站）' : ''}</span>`).addTo(map); }

// ===================================================================
renderPrefToggles(); renderAdv(); renderAbout(); setMode('draw');
</script>
